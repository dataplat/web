baseURL = "https://dbatools.io/"
title = "dbatools | SQL Server automation with PowerShell"
languageCode = "en-us"
defaultContentLanguage = "en"
theme = "dbatools2025"
enableRobotsTXT = true
disablePathToLower = true

[permalinks]
post = "/:slug"
page = "/:slug"
commands = "/:slug"

[params]
description = "A free, open-source PowerShell module with 700+ commands that make SQL Server administration simple, powerful, and fun."

[markup]
defaultMarkdownHandler = "goldmark"

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = "github"
wrapStandAloneImageWithinParagraph = true

[markup.goldmark.parser.attribute]
block = true
title = true

[mediaTypes]
[mediaTypes."text/netlify"]
delimiter = ""

[outputFormats]
[outputFormats.REDIRECTS]
mediaType = "text/netlify"
baseName = "_redirects"
isPlainText = true
notAlternative = true

[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "search"
isPlainText = true
notAlternative = true

[outputFormats.Articles]
mediaType = "application/json"
baseName = "articles"
isPlainText = true
notAlternative = true

# Markdown mirror of every page, served at /<page>/index.md and advertised from
# the HTML with <link rel="alternate" type="text/markdown">. OpenAI's and
# Anthropic's crawlers do not execute JavaScript and parse HTML for text; a
# clean markdown copy removes the guesswork, and it is what people get when
# they paste a URL into an assistant. See layouts/commands/single.md.
[outputFormats.MD]
mediaType = "text/markdown"
isPlainText = true
isHTML = false

# llms.txt — an index of the site in markdown, per the llmstxt.org proposal.
# No answer engine documents using this file, so it is a cheap hedge rather
# than a strategy. See research/optimizing-docs-sites-for-llms-2026-07-31.md.
[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "REDIRECTS", "SearchIndex", "Articles", "LLMS"]
page = ["HTML", "MD"]
