{{ define "main" }}
<div class="min-h-screen flex items-center justify-center bg-white">
  <div class="max-w-2xl mx-auto px-12 text-center">

    <!-- Error Message -->
    <h1 class="text-6xl font-extrabold text-slate-900 mb-6">404</h1>
    <h2 class="text-3xl font-bold text-slate-700 mb-6">Page not found</h2>

    <p class="text-xl text-slate-600 mb-12 leading-relaxed">
      Looks like this page has been migrated to the great database in the sky.
      Try searching our docs or head back home.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-wrap justify-center gap-6">
      <a href="/" class="bg-primary text-white px-8 py-4 rounded-xl hover:bg-accent hover:scale-105 transition-all font-semibold shadow-md text-lg inline-block">
        ← Back to Home
      </a>
      <a href="https://docs.dbatools.io" target="_blank" class="bg-slate-100 text-slate-900 px-8 py-4 rounded-xl hover:scale-105 transition-all font-semibold shadow-md text-lg inline-block">
        Search Documentation
      </a>
    </div>

  </div>
</div>
{{ end }}
