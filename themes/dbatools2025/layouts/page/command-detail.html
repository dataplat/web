{{ define "main" }}

<!-- Commands Page CSS -->
<link rel="stylesheet" href="/css/commands-page.css">

<!-- Add JetBrains Mono font -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Add Fuse.js -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>


<div class="commands-container">
    <div class="commands-layout">
        <aside class="commands-sidebar">
            <div class="filter-section">
                <button class="popular-button" id="popular-filter-btn">
                    ⭐ Popular Commands
                </button>
            </div>

            <div class="filter-section">
                <span class="filter-section-title">Categories</span>
                <div class="filter-list" id="categories-list"></div>
            </div>

            <div class="filter-section">
                <span class="filter-section-title">Actions</span>
                <div class="filter-list" id="actions-list"></div>
            </div>

            <button class="reset-button" id="reset-filters">Reset All Filters</button>
        </aside>

        <main class="commands-main">
            <!-- Breadcrumbs -->
            <nav class="mb-8 text-sm text-theme-text-secondary">
                <a href="/" class="hover:text-primary transition-colors">Home</a>
                <span class="mx-2">/</span>
                <a href="/commands" class="hover:text-primary transition-colors">Commands</a>
                <span class="mx-2">/</span>
                <span class="text-theme-text">{{ .Title }}</span>
            </nav>

            <!-- Command Documentation -->
            <article class="prose prose-lg max-w-none
                prose-headings:font-bold
                prose-h1:text-5xl prose-h1:mb-6 prose-h1:font-mono prose-h1:text-green-500
                prose-h2:text-3xl prose-h2:mt-12 prose-h2:mb-4
                prose-h3:text-2xl prose-h3:mt-8 prose-h3:mb-3
                prose-h4:text-xl prose-h4:mt-6 prose-h4:mb-2
                prose-h5:text-lg prose-h5:mt-4 prose-h5:mb-2 prose-h5:text-primary
                prose-a:text-primary prose-a:no-underline hover:prose-a:underline
                prose-code:text-green-500 prose-code:bg-theme-card prose-code:px-2 prose-code:py-1 prose-code:rounded prose-code:font-mono prose-code:text-sm
                prose-pre:bg-theme-card prose-pre:border-2 prose-pre:border-theme-border prose-pre:rounded-lg prose-pre:p-6
                prose-table:border-2 prose-table:border-theme-border
                prose-th:bg-theme-card prose-th:p-3
                prose-td:border prose-td:border-theme-border prose-td:p-3
            ">
                {{ .Content }}
            </article>

            <!-- Back to Commands Button -->
            <div class="text-center mt-12 mb-8">
                <a href="/commands" class="inline-flex items-center gap-2 px-6 py-3 bg-primary text-white rounded-lg font-medium hover:bg-accent-light transition-colors shadow-md hover:shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    Back to All Commands
                </a>
            </div>
        </main>
    </div>
</div>

<!-- Syntax Highlighting -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" class="light-theme">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" class="dark-theme" disabled>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>

<script>
// Command detail page sidebar functionality
let allCommands = [];
let fuse = null;

// Load commands for sidebar
async function loadCommands() {
    try {
        const response = await fetch('/commands.json');
        allCommands = await response.json();

        // Initialize Fuse.js for fuzzy search
        fuse = new Fuse(allCommands, {
            keys: ['name', 'description', 'tags'],
            threshold: 0.3,
            includeScore: true,
            ignoreLocation: true
        });

        // Build sidebar filters
        buildCategoryFilters();
        buildActionFilters();
    } catch (error) {
        console.error('Error loading commands:', error);
    }
}

// Build category filters
function buildCategoryFilters() {
    const container = document.getElementById('categories-list');
    const categories = {};

    // Count commands per category
    allCommands.forEach(cmd => {
        if (cmd.category) {
            categories[cmd.category] = (categories[cmd.category] || 0) + 1;
        }
    });

    // Add "All Commands" first
    const allItem = document.createElement('div');
    allItem.className = 'category-item';
    allItem.innerHTML = `
        <span>All Commands</span>
        <span class="filter-count">${allCommands.length}</span>
    `;
    allItem.onclick = () => window.location.href = '/commands';
    container.appendChild(allItem);

    // Add individual categories
    Object.entries(categories)
        .sort(([a], [b]) => a.localeCompare(b))
        .forEach(([category, count]) => {
            const item = document.createElement('div');
            item.className = 'category-item';
            item.innerHTML = `
                <span>${category}</span>
                <span class="filter-count">${count}</span>
            `;
            item.onclick = () => window.location.href = `/commands?category=${encodeURIComponent(category)}`;
            container.appendChild(item);
        });
}

// Build action filters
function buildActionFilters() {
    const container = document.getElementById('actions-list');
    const actions = {};

    // Count commands per action
    allCommands.forEach(cmd => {
        if (cmd.verb) {
            actions[cmd.verb] = (actions[cmd.verb] || 0) + 1;
        }
    });

    // Add "All Actions" first
    const allItem = document.createElement('div');
    allItem.className = 'action-item';
    allItem.innerHTML = `
        <span>All Actions</span>
        <span class="filter-count">${allCommands.length}</span>
    `;
    allItem.onclick = () => window.location.href = '/commands';
    container.appendChild(allItem);

    // Add top 15 actions by count
    Object.entries(actions)
        .sort(([,a], [,b]) => b - a)
        .slice(0, 15)
        .forEach(([action, count]) => {
            const item = document.createElement('div');
            item.className = 'action-item';
            item.innerHTML = `
                <span>${action}</span>
                <span class="filter-count">${count}</span>
            `;
            item.onclick = () => window.location.href = `/commands?action=${encodeURIComponent(action)}`;
            container.appendChild(item);
        });
}

// Search handling - redirect to commands page with search query
let searchTimeout;
function handleSearch(e) {
    const value = e.target.value.trim();
    const clearBtn = document.getElementById('clear-search');

    if (value) {
        clearBtn.classList.add('visible');
    } else {
        clearBtn.classList.remove('visible');
    }

    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        if (value) {
            // Redirect to commands page with search query
            window.location.href = `/commands?search=${encodeURIComponent(value)}`;
        }
    }, 800);
}

// Clear search
function clearSearch() {
    const searchInput = document.getElementById('search-input');
    searchInput.value = '';
    document.getElementById('clear-search').classList.remove('visible');
    searchInput.focus();
}

// Event listeners
document.addEventListener('DOMContentLoaded', () => {
    // Load commands for sidebar
    loadCommands();

    // Search input
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
        searchInput.addEventListener('input', handleSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                clearSearch();
            }
        });
    }

    // Clear search button
    const clearBtn = document.getElementById('clear-search');
    if (clearBtn) {
        clearBtn.addEventListener('click', clearSearch);
    }

    // Popular button
    const popularBtn = document.getElementById('popular-filter-btn');
    if (popularBtn) {
        popularBtn.addEventListener('click', () => {
            window.location.href = '/commands?popular=1';
        });
    }

    // Reset button
    const resetBtn = document.getElementById('reset-filters');
    if (resetBtn) {
        resetBtn.addEventListener('click', () => {
            window.location.href = '/commands';
        });
    }

    // Keyboard shortcut: / to focus search
    document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
            e.preventDefault();
            searchInput.focus();
        }
    });

    // Syntax highlighting for command documentation
    hljs.highlightAll();

    // Update highlight.js theme based on dark mode
    function updateHighlightTheme() {
        const isDark = document.documentElement.classList.contains('dark');
        const lightTheme = document.querySelector('.light-theme');
        const darkTheme = document.querySelector('.dark-theme');
        if (lightTheme) lightTheme.disabled = isDark;
        if (darkTheme) darkTheme.disabled = !isDark;
    }

    const observer = new MutationObserver(updateHighlightTheme);
    observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['class']
    });
    updateHighlightTheme();
});
</script>

<style>
/* Additional code block styling */
pre code.hljs {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95em;
    line-height: 1.6;
}

/* Custom styling for PowerShell prompts */
article pre code {
    display: block;
    overflow-x: auto;
}

/* Ensure sidebar scrolling works exactly like /commands page */
.commands-sidebar {
    position: sticky;
    top: 100px;
    height: fit-content;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    padding: 24px 20px;
    scrollbar-width: thin;
    scrollbar-gutter: stable;
    background-color: transparent;
    border: 1px solid var(--border-light);
    border-radius: 6px;
}

/* Modern Scrollbar Styling - Sidebar */
.commands-sidebar::-webkit-scrollbar {
    width: 6px;
}

.commands-sidebar::-webkit-scrollbar-track {
    background: transparent;
}

.commands-sidebar::-webkit-scrollbar-thumb {
    background-color: transparent;
    border-radius: 10px;
    transition: background-color 0.3s ease;
}

.commands-sidebar:hover::-webkit-scrollbar-thumb {
    background-color: rgba(0, 0, 0, 0.15);
}

.commands-sidebar::-webkit-scrollbar-thumb:hover {
    background-color: rgba(0, 0, 0, 0.25);
}

/* Ensure filter counts have gray boxes */
.category-item .filter-count,
.action-item .filter-count {
    font-size: 12px;
    font-weight: 600;
    min-width: 24px;
    text-align: center;
    padding: 2px 6px;
    border-radius: 12px;
    background-color: rgba(175, 184, 193, 0.2);
    color: var(--text-muted-light);
}

.category-item.active .filter-count,
.action-item.active .filter-count {
    background-color: rgba(9, 105, 218, 0.12);
    color: var(--accent-blue);
}
</style>

{{ end }}
