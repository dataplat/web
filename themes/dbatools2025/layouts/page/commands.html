{{ define "main" }}

<!--
    COMMANDS LISTING PAGE TEMPLATE
    This file renders the /commands page (list of all commands with filters)
    CSS Files Used:
    - commands-page.css: ALL styles for this page
    JS Files Used:
    - commands-page.js: Filter logic, search, sorting
-->

<!-- Commands Page CSS -->
<link rel="stylesheet" href="/css/commands-page.css">

<!-- Add JetBrains Mono font -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Add Fuse.js -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<div class="commands-container">
    <div class="commands-header">
        <div class="commands-header-content">
            <div class="version-badge" id="version-badge">
                <span class="version-dot"></span>
                <span id="version-text">Loading...</span>
            </div>
            <h1 class="commands-title">dbatools Commands</h1>
            <p class="commands-subtitle">Browse and search <span id="command-count-text">over 700</span> PowerShell commands for SQL Server</p>
            <div class="search-container">
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="Search commands..."
                    autocomplete="off"
                >
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <button class="search-clear" id="clear-search" aria-label="Clear search">&times;</button>
            </div>
        </div>
    </div>

    <div class="commands-layout">
        <aside class="commands-sidebar">
            <div class="filter-section">
                <button class="popular-button" id="popular-filter-btn">
                    ⭐ Popular Commands
                </button>
            </div>

            <div class="filter-section">
                <span class="filter-section-title">Categories</span>
                <div class="filter-list" id="categories-list"></div>
            </div>

            <div class="filter-section">
                <span class="filter-section-title">Actions</span>
                <div class="filter-list" id="actions-list"></div>
            </div>

            <button class="reset-button" id="reset-filters">Reset All Filters</button>
        </aside>

        <main class="commands-main">
            <div class="commands-header-bar">
                <p class="commands-count"><span id="results-count">0</span> commands</p>
                <div class="commands-controls">
                    <div class="view-toggle">
                        <button class="view-toggle-btn active" id="grid-view-btn" title="Grid view" aria-label="Grid view">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="2" width="5" height="5" rx="1"></rect>
                                <rect x="11" y="2" width="5" height="5" rx="1"></rect>
                                <rect x="2" y="11" width="5" height="5" rx="1"></rect>
                                <rect x="11" y="11" width="5" height="5" rx="1"></rect>
                            </svg>
                        </button>
                        <button class="view-toggle-btn" id="list-view-btn" title="List view" aria-label="List view">
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="4" x2="15" y2="4"></line>
                                <line x1="3" y1="9" x2="15" y2="9"></line>
                                <line x1="3" y1="14" x2="15" y2="14"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="sort-container">
                        <label for="sort-select" class="sort-label">Sort by:</label>
                        <select id="sort-select" class="sort-select">
                            <option value="alphabetical">Alphabetical</option>
                            <option value="popular">Popular First</option>
                            <option value="category">By Category</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="commands-grid" id="commands-grid"></div>

            <div class="show-more-container hidden" id="show-more-container">
                <button class="show-more-button" id="show-more-btn">
                    Show More Results (<span id="remaining-count">0</span> more)
                </button>
            </div>

            <p class="popularity-note" id="popularity-note">* Based on website stats</p>

            <div class="no-results hidden" id="no-results">
                <p class="no-results-text">No commands found</p>
                <p class="no-results-hint">Try adjusting your filters or search terms</p>
                <button class="reset-button" onclick="document.getElementById('reset-filters').click()">
                    Reset Filters
                </button>
            </div>
        </main>
    </div>
</div>

<!-- Commands Page JavaScript -->
<script src="/js/commands-page.js"></script>

<script>
// Fetch dbatools version from GitHub releases API (CORS-friendly)
async function fetchDbatoolsVersion() {
    try {
        const response = await fetch('https://api.github.com/repos/dataplat/dbatools/releases/latest');
        const data = await response.json();

        if (data.tag_name) {
            const version = data.tag_name.replace(/^v/, '');
            document.getElementById('version-text').textContent = `v${version} Released`;
        }
    } catch (error) {
        document.getElementById('version-text').textContent = 'Latest Release';
    }
}

// Update command count when commands are loaded
function updateCommandCount() {
    const checkCount = setInterval(() => {
        const countEl = document.getElementById('results-count');
        if (countEl && countEl.textContent !== '0') {
            const count = parseInt(countEl.textContent);
            if (count > 0) {
                document.getElementById('command-count-text').textContent = count.toLocaleString();
                clearInterval(checkCount);
            }
        }
    }, 100);

    // Stop checking after 5 seconds
    setTimeout(() => clearInterval(checkCount), 5000);
}

fetchDbatoolsVersion();
updateCommandCount();
</script>

{{ end }}
