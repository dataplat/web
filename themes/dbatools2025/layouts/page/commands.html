{{ define "main" }}

<!-- Commands Page CSS -->
<link rel="stylesheet" href="/css/commands-page.css">

<!-- Add JetBrains Mono font -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Add Fuse.js -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<div class="commands-container">
    <div class="commands-header">
        <div class="commands-header-content">
            <h1 class="commands-title">dbatools Commands</h1>
            <p class="commands-subtitle">Browse and search nearly 700 PowerShell commands for SQL Server</p>
            <div class="search-container">
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="Search commands..."
                    autocomplete="off"
                >
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <button class="search-clear" id="clear-search" aria-label="Clear search">&times;</button>
            </div>
        </div>
    </div>

    <div class="commands-layout">
        <aside class="commands-sidebar">
            <div class="filter-section">
                <button class="popular-button" id="popular-filter-btn">
                    ⭐ Popular Commands
                </button>
            </div>

            <div class="filter-section">
                <span class="filter-section-title">Categories</span>
                <div class="filter-list" id="categories-list"></div>
            </div>

            <div class="filter-section">
                <span class="filter-section-title">Actions</span>
                <div class="filter-list" id="actions-list"></div>
            </div>

            <button class="reset-button" id="reset-filters">Reset All Filters</button>
        </aside>

        <main class="commands-main">
            <div class="commands-header-bar">
                <p class="commands-count"><span id="results-count">0</span> commands</p>
                <div class="sort-container">
                    <label for="sort-select" class="sort-label">Sort by:</label>
                    <select id="sort-select" class="sort-select">
                        <option value="alphabetical">Alphabetical</option>
                        <option value="popular">Popular First</option>
                        <option value="category">By Category</option>
                    </select>
                </div>
            </div>

            <div class="commands-grid" id="commands-grid"></div>

            <p class="popularity-note" id="popularity-note">* Based on website stats</p>

            <div class="no-results hidden" id="no-results">
                <p class="no-results-text">No commands found</p>
                <p class="no-results-hint">Try adjusting your filters or search terms</p>
                <button class="reset-button" onclick="document.getElementById('reset-filters').click()">
                    Reset Filters
                </button>
            </div>
        </main>
    </div>
</div>

<!-- Commands Page JavaScript -->
<script src="/js/commands-page.js"></script>

{{ end }}
