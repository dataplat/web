<header class="fixed w-full top-0 bg-white/60 dark:bg-theme-bg-dark/60 backdrop-blur-xl border-b border-theme-border/50 dark:border-theme-border-dark/50 z-50">
  <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">

    <!-- Logo -->
    <a href="/" class="text-xl font-semibold text-theme-text dark:text-theme-text-dark hover:opacity-70 transition-opacity">
      dbatools
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
      <a href="/getting-started/" class="text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors">Getting Started</a>
      <a href="https://docs.dbatools.io/commands" target="_blank" class="text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors">Commands</a>
      <a href="https://docs.dbatools.io" target="_blank" class="text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors">Docs</a>
      <a href="https://github.com/dataplat/dbatools" target="_blank" class="text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors">GitHub</a>
    </nav>

    <!-- Theme Picker & CTA Button -->
    <div class="hidden md:flex items-center gap-4">
      <!-- Theme Picker Dropdown -->
      <div class="relative">
        <button id="theme-picker-btn" class="p-2 rounded-lg hover:bg-theme-card dark:hover:bg-theme-card-dark transition-colors" aria-label="Select theme">
          <svg class="w-5 h-5 text-theme-text-secondary dark:text-theme-text-secondary-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
          </svg>
        </button>
        <div id="theme-picker-menu" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-theme-card-dark border border-theme-border dark:border-theme-border-dark rounded-lg shadow-lg overflow-hidden z-50">
          <button data-theme="default-light" class="theme-option w-full px-4 py-2 text-left text-sm text-theme-text-secondary dark:text-theme-text-secondary-dark hover:bg-theme-card dark:hover:bg-theme-bg-dark transition-colors">
            Default Light
          </button>
          <button data-theme="default-dark" class="theme-option w-full px-4 py-2 text-left text-sm text-theme-text-secondary dark:text-theme-text-secondary-dark hover:bg-theme-card dark:hover:bg-theme-bg-dark transition-colors">
            Default Dark
          </button>
          <button data-theme="vscode-2024" class="theme-option w-full px-4 py-2 text-left text-sm text-theme-text-secondary dark:text-theme-text-secondary-dark hover:bg-theme-card dark:hover:bg-theme-bg-dark transition-colors">
            VS Code 2024
          </button>
          <button data-theme="github-dim" class="theme-option w-full px-4 py-2 text-left text-sm text-theme-text-secondary dark:text-theme-text-secondary-dark hover:bg-theme-card dark:hover:bg-theme-bg-dark transition-colors">
            GitHub Dim
          </button>
        </div>
      </div>
      <a href="/download/" class="inline-flex items-center gap-2 px-4 py-2 bg-theme-text dark:bg-theme-text-dark text-white dark:text-theme-bg-dark rounded-lg text-sm font-medium hover:scale-[1.02] transition-transform">
        <span>Install</span>
      </a>
    </div>

    <!-- Mobile Menu Button -->
    <button id="mobile-menu-btn" class="md:hidden text-theme-text dark:text-theme-text-dark p-2" aria-label="Toggle menu">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>

  <!-- Mobile Navigation -->
  <nav id="mobile-menu" class="hidden md:hidden bg-white dark:bg-theme-bg-dark border-t border-theme-border dark:border-theme-border-dark px-6 py-6">
    <div class="flex flex-col gap-4">
      <a href="/getting-started/" class="text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors py-2">Getting Started</a>
      <a href="https://docs.dbatools.io/commands" target="_blank" class="text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors py-2">Commands</a>
      <a href="https://docs.dbatools.io" target="_blank" class="text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors py-2">Docs</a>
      <a href="https://github.com/dataplat/dbatools" target="_blank" class="text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors py-2">GitHub</a>

      <!-- Mobile Theme Picker -->
      <div class="py-2">
        <span class="text-xs text-theme-text-secondary dark:text-theme-text-secondary-dark uppercase tracking-wider">Theme</span>
        <div class="flex flex-col gap-2 mt-2">
          <button data-theme="default-light" class="theme-option-mobile text-left text-sm text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors">
            Default Light
          </button>
          <button data-theme="default-dark" class="theme-option-mobile text-left text-sm text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors">
            Default Dark
          </button>
          <button data-theme="vscode-2024" class="theme-option-mobile text-left text-sm text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors">
            VS Code 2024
          </button>
          <button data-theme="github-dim" class="theme-option-mobile text-left text-sm text-theme-text-secondary dark:text-theme-text-secondary-dark hover:text-theme-text dark:hover:text-theme-text-dark transition-colors">
            GitHub Dim
          </button>
        </div>
      </div>

      <a href="/download/" class="bg-theme-text dark:bg-theme-text-dark text-white dark:text-theme-bg-dark px-4 py-2 rounded-lg text-center font-medium mt-2">Install</a>
    </div>
  </nav>
</header>

<script>
  // Mobile menu toggle
  document.getElementById('mobile-menu-btn')?.addEventListener('click', function() {
    const menu = document.getElementById('mobile-menu');
    menu?.classList.toggle('hidden');
  });

  // Theme Picker functionality
  const themePickerBtn = document.getElementById('theme-picker-btn');
  const themePickerMenu = document.getElementById('theme-picker-menu');
  const themeOptions = document.querySelectorAll('.theme-option, .theme-option-mobile');

  // Toggle dropdown menu
  themePickerBtn?.addEventListener('click', function(e) {
    e.stopPropagation();
    themePickerMenu?.classList.toggle('hidden');
  });

  // Close dropdown when clicking outside
  document.addEventListener('click', function() {
    themePickerMenu?.classList.add('hidden');
  });

  // Apply theme function
  function applyTheme(themeName) {
    const html = document.documentElement;

    // Remove all theme classes
    html.classList.remove('dark', 'theme-vscode-2024', 'theme-github-dim');

    // Apply the selected theme
    if (themeName === 'default-dark') {
      html.classList.add('dark');
    } else if (themeName === 'vscode-2024') {
      html.classList.add('theme-vscode-2024');
    } else if (themeName === 'github-dim') {
      html.classList.add('theme-github-dim');
    }
    // default-light doesn't need a class

    // Save to localStorage
    localStorage.setItem('theme', themeName);

    // Close the dropdown
    themePickerMenu?.classList.add('hidden');

    // Update active state on buttons
    updateActiveTheme(themeName);
  }

  // Update active state on theme buttons
  function updateActiveTheme(themeName) {
    themeOptions.forEach(option => {
      if (option.dataset.theme === themeName) {
        option.style.fontWeight = '600';
        option.style.backgroundColor = 'var(--color-hover, rgba(0,0,0,0.1))';
      } else {
        option.style.fontWeight = '400';
        option.style.backgroundColor = '';
      }
    });
  }

  // Add click event listeners to all theme options
  themeOptions.forEach(option => {
    option.addEventListener('click', function() {
      const themeName = this.dataset.theme;
      applyTheme(themeName);

      // Close mobile menu if open
      const mobileMenu = document.getElementById('mobile-menu');
      if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
        mobileMenu.classList.add('hidden');
      }
    });
  });

  // Check for saved theme preference or default to default-dark
  const savedTheme = localStorage.getItem('theme') || 'default-dark';

  // Apply the saved theme on page load
  applyTheme(savedTheme);
</script>
