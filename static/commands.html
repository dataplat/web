<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dbatools Commands Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <style>
        :root {
            /* Light theme (default) - Modern, clean design */
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-command: #059669;
            --border-color: #cbd5e1;
            --accent-primary: #2563eb;
            --accent-hover: #1d4ed8;
            --tag-bg: #e0f2fe;
            --tag-text: #0369a1;
            --sidebar-bg: #ffffff;
            --search-bg: #ffffff;
            --input-border: #cbd5e1;
            --input-border-focus: #2563eb;
            --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -1px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
            --shadow-xl: 0 20px 35px -10px rgba(15, 23, 42, 0.15), 0 10px 15px -8px rgba(15, 23, 42, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-card: #1a1f2e;
            --bg-card-hover: #252b3b;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-command: #10b981;
            --border-color: #374151;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --tag-bg: #374151;
            --tag-text: #9ca3af;
            --sidebar-bg: #1a1f2e;
            --search-bg: #252b3b;
            --input-border: #374151;
            --input-border-focus: #3b82f6;
            --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.35), 0 2px 4px -1px rgba(0,0,0,0.25);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.4), 0 8px 10px -6px rgba(0,0,0,0.3);
            --shadow-xl: 0 20px 35px -10px rgba(0,0,0,0.5), 0 10px 15px -8px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-md);
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            max-width: 600px;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        #searchInput {
            width: 100%;
            padding: 0.875rem 3rem 0.875rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background: var(--search-bg);
            color: var(--text-primary);
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            box-shadow: var(--shadow);
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1), var(--shadow-md);
        }

        .search-icon {
            position: absolute;
            right: 1rem;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            right: 1rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0.25rem;
            display: none;
            transition: color 0.2s ease;
        }

        .clear-search:hover {
            color: var(--text-primary);
        }

        .clear-search.visible {
            display: block;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.25rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow);
        }

        .theme-toggle:hover {
            background: var(--bg-card-hover);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
            border-color: var(--accent-primary);
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            max-width: 1600px;
            margin: 0 auto;
            min-height: calc(100vh - 200px);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            padding: 2rem 1.5rem;
            border-right: 2px solid var(--border-color);
            position: sticky;
            top: 180px;
            height: fit-content;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            box-shadow: var(--shadow);
        }

        .sidebar h3 {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        .sidebar h3:first-child {
            margin-top: 0;
        }

        .filter-item {
            padding: 0.625rem 0.75rem;
            margin-bottom: 0.25rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border: 2px solid transparent;
        }

        .filter-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-color);
        }

        .filter-item.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .filter-count {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--tag-bg);
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
        }

        .filter-item.active .filter-count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Action Filters */
        .action-filters {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .action-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .action-checkbox:hover {
            background: var(--bg-card-hover);
        }

        .action-checkbox input[type="checkbox"] {
            width: 1.125rem;
            height: 1.125rem;
            cursor: pointer;
            accent-color: var(--accent-primary);
        }

        .action-checkbox label {
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Popular Commands */
        .popular-filter {
            background: var(--tag-bg);
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            border: 2px solid transparent;
            font-weight: 600;
        }

        .popular-filter:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-color);
        }

        .popular-filter.active {
            border-color: var(--accent-primary);
            background: rgba(37, 99, 235, 0.1);
            box-shadow: var(--shadow-md);
        }

        .reset-filters {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 1rem;
            box-shadow: var(--shadow);
        }

        .reset-filters:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem 1.5rem;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .results-count {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .sort-dropdown {
            padding: 0.625rem 1rem;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .sort-dropdown:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-md);
        }

        .sort-dropdown:focus {
            outline: none;
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1), var(--shadow-md);
        }

        /* Command Cards Grid */
        .commands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .command-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .command-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--text-command));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .command-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: var(--accent-primary);
        }

        .command-card:hover::before {
            opacity: 1;
        }

        .command-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.75rem;
        }

        .command-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-command);
            word-break: break-word;
            letter-spacing: -0.01em;
        }

        .popular-badge {
            font-size: 1.25rem;
            margin-left: 0.5rem;
        }

        .command-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .command-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 0.25rem 0.625rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .skeleton-line {
            background: var(--border-color);
            height: 1rem;
            border-radius: 4px;
            margin-bottom: 0.75rem;
        }

        .skeleton-line.short {
            width: 60%;
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--shadow-xl);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .mobile-menu-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 25px 45px -15px rgba(37, 99, 235, 0.4);
        }

        .mobile-menu-toggle:active {
            transform: scale(0.95);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                max-height: 100vh;
                z-index: 999;
                transition: left 0.3s ease;
            }

            .sidebar.open {
                left: 0;
            }

            .mobile-menu-toggle {
                display: block;
            }

            .commands-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }

            .theme-toggle {
                top: 1rem;
                right: 1rem;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 1.5rem 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .main-content {
                padding: 1.5rem 1rem;
            }

            .commands-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .content-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .theme-toggle {
                padding: 0.375rem 0.75rem;
                font-size: 1rem;
            }
        }

        /* Overlay for mobile sidebar */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        .sidebar-overlay.visible {
            display: block;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <span id="themeIcon">🌙</span>
            </button>
            <h1>dbatools Commands</h1>
            <p class="subtitle">PowerShell tools for SQL Server automation</p>
            <div class="search-container">
                <div class="search-wrapper">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Find any command..."
                        autocomplete="off"
                    >
                    <span class="search-icon" id="searchIcon">🔍</span>
                    <button class="clear-search" id="clearSearch" aria-label="Clear search">&times;</button>
                </div>
            </div>
        </div>
    </header>

    <div class="main-layout container">
        <aside class="sidebar" id="sidebar">
            <h3>Categories</h3>
            <div id="categoryFilters"></div>

            <h3>Actions</h3>
            <div class="action-filters" id="actionFilters"></div>

            <h3>Quick Filters</h3>
            <div class="popular-filter" id="popularFilter">
                ⭐ Popular Commands
            </div>

            <button class="reset-filters" id="resetFilters">Reset All Filters</button>
        </aside>

        <main class="main-content">
            <div class="content-header">
                <div class="results-count" id="resultsCount">Loading commands...</div>
                <select class="sort-dropdown" id="sortDropdown">
                    <option value="alphabetical">Alphabetical</option>
                    <option value="popular">Popular First</option>
                    <option value="category">By Category</option>
                </select>
            </div>

            <div class="commands-grid" id="commandsGrid">
                <!-- Loading skeleton -->
                <div class="skeleton-card">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
            </div>
        </main>
    </div>

    <button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script>
        // State management
        let allCommands = [];
        let filteredCommands = [];
        let categories = {};
        let actions = {};
        let fuse = null;

        // Current filters
        let currentSearch = '';
        let currentCategory = 'all';
        let currentActions = new Set();
        let showPopularOnly = false;
        let currentSort = 'alphabetical';

        // Initialize theme
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            icon.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        // Load commands
        async function loadCommands() {
            try {
                const response = await fetch('/commands.json');
                allCommands = await response.json();

                // Build categories and actions
                allCommands.forEach(cmd => {
                    // Categories
                    if (cmd.category) {
                        categories[cmd.category] = (categories[cmd.category] || 0) + 1;
                    }
                    // Actions/Verbs
                    if (cmd.verb) {
                        actions[cmd.verb] = (actions[cmd.verb] || 0) + 1;
                    }
                });

                // Initialize Fuse.js for fuzzy search
                fuse = new Fuse(allCommands, {
                    keys: ['name', 'description', 'tags'],
                    threshold: 0.3,
                    includeScore: true,
                    ignoreLocation: true
                });

                // Build UI
                buildCategoryFilters();
                buildActionFilters();

                // Parse URL parameters
                parseURLState();

                // Apply filters and render
                applyFilters();
            } catch (error) {
                console.error('Error loading commands:', error);
                showError();
            }
        }

        // Build category filters
        function buildCategoryFilters() {
            const container = document.getElementById('categoryFilters');

            // All commands
            const allItem = document.createElement('div');
            allItem.className = 'filter-item active';
            allItem.innerHTML = `
                <span>All Commands</span>
                <span class="filter-count">${allCommands.length}</span>
            `;
            allItem.onclick = () => selectCategory('all');
            container.appendChild(allItem);

            // Individual categories
            Object.entries(categories)
                .sort(([a], [b]) => a.localeCompare(b))
                .forEach(([category, count]) => {
                    const item = document.createElement('div');
                    item.className = 'filter-item';
                    item.innerHTML = `
                        <span>${category}</span>
                        <span class="filter-count">${count}</span>
                    `;
                    item.onclick = () => selectCategory(category);
                    item.dataset.category = category;
                    container.appendChild(item);
                });
        }

        // Build action filters
        function buildActionFilters() {
            const container = document.getElementById('actionFilters');

            // Map common verbs to action labels
            const actionLabels = {
                'Get': 'Get (retrieve info)',
                'Set': 'Set (configure)',
                'Copy': 'Copy (migrate)',
                'Test': 'Test (validate)',
                'Invoke': 'Invoke (execute)',
                'New': 'New (create)',
                'Remove': 'Remove (delete)',
                'Export': 'Export',
                'Import': 'Import',
                'Backup': 'Backup',
                'Restore': 'Restore',
                'Add': 'Add',
                'Update': 'Update',
                'Start': 'Start',
                'Stop': 'Stop'
            };

            Object.entries(actions)
                .sort(([a], [b]) => b - a) // Sort by count descending
                .slice(0, 15) // Show top 15 actions
                .forEach(([action, count]) => {
                    const label = document.createElement('label');
                    label.className = 'action-checkbox';
                    label.innerHTML = `
                        <input type="checkbox" value="${action}" onchange="toggleAction('${action}')">
                        <span>${actionLabels[action] || action} (${count})</span>
                    `;
                    container.appendChild(label);
                });
        }

        // Filter functions
        function selectCategory(category) {
            currentCategory = category;

            // Update UI
            document.querySelectorAll('#categoryFilters .filter-item').forEach(item => {
                item.classList.remove('active');
                if (category === 'all' && item.querySelector('span').textContent === 'All Commands') {
                    item.classList.add('active');
                } else if (item.dataset.category === category) {
                    item.classList.add('active');
                }
            });

            updateURLState();
            applyFilters();
        }

        function toggleAction(action) {
            if (currentActions.has(action)) {
                currentActions.delete(action);
            } else {
                currentActions.add(action);
            }
            updateURLState();
            applyFilters();
        }

        function togglePopular() {
            showPopularOnly = !showPopularOnly;
            document.getElementById('popularFilter').classList.toggle('active', showPopularOnly);
            updateURLState();
            applyFilters();
        }

        function resetFilters() {
            currentSearch = '';
            currentCategory = 'all';
            currentActions.clear();
            showPopularOnly = false;

            // Update UI
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearch').classList.remove('visible');
            document.querySelectorAll('#actionFilters input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.getElementById('popularFilter').classList.remove('active');
            selectCategory('all');

            updateURLState();
            applyFilters();
        }

        // Apply all filters
        function applyFilters() {
            let results = allCommands;

            // Search filter
            if (currentSearch) {
                const fuseResults = fuse.search(currentSearch);
                results = fuseResults.map(result => result.item);
            }

            // Category filter
            if (currentCategory !== 'all') {
                results = results.filter(cmd => cmd.category === currentCategory);
            }

            // Action filter
            if (currentActions.size > 0) {
                results = results.filter(cmd => currentActions.has(cmd.verb));
            }

            // Popular filter
            if (showPopularOnly) {
                results = results.filter(cmd => cmd.popular);
            }

            filteredCommands = results;
            sortAndRender();
        }

        // Sort and render
        function sortAndRender() {
            let sorted = [...filteredCommands];

            switch (currentSort) {
                case 'alphabetical':
                    sorted.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'popular':
                    sorted.sort((a, b) => {
                        if (a.popular && !b.popular) return -1;
                        if (!a.popular && b.popular) return 1;
                        return a.name.localeCompare(b.name);
                    });
                    break;
                case 'category':
                    sorted.sort((a, b) => {
                        const catCompare = (a.category || '').localeCompare(b.category || '');
                        if (catCompare !== 0) return catCompare;
                        return a.name.localeCompare(b.name);
                    });
                    break;
            }

            renderCommands(sorted);
        }

        // Render commands
        function renderCommands(commands) {
            const grid = document.getElementById('commandsGrid');
            const count = document.getElementById('resultsCount');

            count.textContent = `Showing ${commands.length} command${commands.length !== 1 ? 's' : ''}`;

            if (commands.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <h2>No commands found</h2>
                        <p>Try different keywords or browse categories</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = commands.map(cmd => `
                <a href="${cmd.url}" class="command-card" target="_blank" rel="noopener noreferrer">
                    <div class="command-header">
                        <h3 class="command-name">${cmd.name}</h3>
                        ${cmd.popular ? '<span class="popular-badge">⭐</span>' : ''}
                    </div>
                    <p class="command-description">${cmd.description}</p>
                    <div class="command-tags">
                        ${cmd.tags.slice(0, 3).map(tag => `<span class="tag">#${tag}</span>`).join('')}
                    </div>
                </a>
            `).join('');
        }

        // Search handling
        let searchTimeout;
        function handleSearch(e) {
            const value = e.target.value;

            // Show/hide clear button
            document.getElementById('clearSearch').classList.toggle('visible', value.length > 0);

            // Debounce search
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearch = value;
                updateURLState();
                applyFilters();
            }, 150);
        }

        // URL state management
        function updateURLState() {
            const params = new URLSearchParams();

            if (currentSearch) params.set('search', currentSearch);
            if (currentCategory !== 'all') params.set('category', currentCategory);
            if (currentActions.size > 0) params.set('actions', Array.from(currentActions).join(','));
            if (showPopularOnly) params.set('popular', '1');
            if (currentSort !== 'alphabetical') params.set('sort', currentSort);

            const newURL = params.toString() ? `?${params.toString()}` : window.location.pathname;
            window.history.replaceState({}, '', newURL);
        }

        function parseURLState() {
            const params = new URLSearchParams(window.location.search);

            // Search
            const search = params.get('search');
            if (search) {
                currentSearch = search;
                document.getElementById('searchInput').value = search;
                document.getElementById('clearSearch').classList.add('visible');
            }

            // Category
            const category = params.get('category');
            if (category && categories[category]) {
                selectCategory(category);
            }

            // Actions
            const actions = params.get('actions');
            if (actions) {
                actions.split(',').forEach(action => {
                    if (this.actions[action]) {
                        currentActions.add(action);
                        const checkbox = document.querySelector(`#actionFilters input[value="${action}"]`);
                        if (checkbox) checkbox.checked = true;
                    }
                });
            }

            // Popular
            if (params.get('popular') === '1') {
                showPopularOnly = true;
                document.getElementById('popularFilter').classList.add('active');
            }

            // Sort
            const sort = params.get('sort');
            if (sort) {
                currentSort = sort;
                document.getElementById('sortDropdown').value = sort;
            }
        }

        function showError() {
            const grid = document.getElementById('commandsGrid');
            grid.innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1;">
                    <h2>Error loading commands</h2>
                    <p>Please refresh the page to try again</p>
                </div>
            `;
        }

        // Mobile sidebar toggle
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('visible');
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadCommands();

            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            document.getElementById('clearSearch').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('clearSearch').classList.remove('visible');
                currentSearch = '';
                updateURLState();
                applyFilters();
            });
            document.getElementById('popularFilter').addEventListener('click', togglePopular);
            document.getElementById('resetFilters').addEventListener('click', resetFilters);
            document.getElementById('sortDropdown').addEventListener('change', (e) => {
                currentSort = e.target.value;
                updateURLState();
                sortAndRender();
            });
            document.getElementById('mobileMenuToggle').addEventListener('click', toggleMobileSidebar);
            document.getElementById('sidebarOverlay').addEventListener('click', toggleMobileSidebar);

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && e.target.tagName !== 'INPUT') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
                if (e.key === 'Escape') {
                    if (document.getElementById('sidebar').classList.contains('open')) {
                        toggleMobileSidebar();
                    } else if (currentSearch) {
                        document.getElementById('clearSearch').click();
                    }
                }
            });
        });
    </script>
</body>
</html>
