<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dbatools Social Card - Wide Format</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* Twitter/X Card: 1200x628 aspect ratio */
        .card {
            background: linear-gradient(135deg, #161b22 0%, #0d1117 50%, #1a1f2e 100%);
            border: 1px solid #30363d;
            border-radius: 16px;
            width: 1200px;
            height: 628px;
            position: relative;
            overflow: hidden;
            display: flex;
            padding: 60px;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #3b82f6, #60a5fa, #93c5fd, #60a5fa, #3b82f6);
        }

        /* Decorative background elements */
        .card::after {
            content: '';
            position: absolute;
            right: -100px;
            bottom: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 60px;
            z-index: 1;
        }

        .right-section {
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .logo {
            width: 200px;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.3));
        }

        .org-name {
            font-size: 16px;
            font-weight: 600;
            color: #8b949e;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 56px;
            font-weight: 800;
            color: #f0f6fc;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .tagline {
            font-size: 20px;
            color: #c9d1d9;
            line-height: 1.5;
            margin-bottom: 40px;
            max-width: 600px;
        }

        .stats {
            display: flex;
            gap: 40px;
            margin-bottom: 32px;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            color: #f0f6fc;
        }

        .stat-label {
            font-size: 14px;
            color: #8b949e;
            font-weight: 500;
            margin-top: 4px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge.green {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border-color: rgba(34, 197, 94, 0.3);
        }

        .badge.purple {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border-color: rgba(168, 85, 247, 0.3);
        }

        .url {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 16px;
            color: #8b949e;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .github-icon {
            width: 24px;
            height: 24px;
            fill: #8b949e;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="left-section">
            <div class="org-name">dataplat</div>
            <h1>dbatools</h1>
            <p class="tagline">SQL Server automation and instance migrations have never been safer, faster or freer</p>

            <div class="stats">
                <div class="stat">
                    <span class="stat-value">270</span>
                    <span class="stat-label">Contributors</span>
                </div>
                <div class="stat">
                    <span class="stat-value">700</span>
                    <span class="stat-label">Commands</span>
                </div>
                <div class="stat">
                    <span class="stat-value">2.7k</span>
                    <span class="stat-label">Stars</span>
                </div>
                <div class="stat">
                    <span class="stat-value">8M+</span>
                    <span class="stat-label">Downloads</span>
                </div>
            </div>

            <div class="badges">
                <span class="badge">PowerShell</span>
                <span class="badge green">SQL Server 2000-2025</span>
                <span class="badge purple">10+ Years Active</span>
            </div>
        </div>

        <div class="right-section">
            <img src="thor.png" alt="dbatools Thor mascot" class="logo">
        </div>

        <div class="url">
            <svg class="github-icon" viewBox="0 0 16 16"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
            dbatools.io
        </div>
    </div>
</body>
</html>
